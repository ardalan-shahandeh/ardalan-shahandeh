<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120" role="img" aria-labelledby="t d">
  <title id="t">Developer Portal</title>
  <desc id="d">Section title for the developer portal control surface</desc>
  <defs>
    <linearGradient id="grad" x1="0" x2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00DC82"/>
      <stop offset="100%" stop-color="#00C58E"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="120" fill="#020420"/>
  <text x="500" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="6" fill="#00E5FF">ARDALAN // SYSTEM ACCESS</text>
  <text x="500" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="900" fill="url(#grad)" filter="url(#glow)">DEVELOPER PORTAL</text>
</svg>
