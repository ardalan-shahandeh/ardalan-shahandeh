<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" role="img" aria-labelledby="t d">
  <title id="t">Ardalan Core</title>
  <desc id="d">Front-End Engineer core identity panel covering stack, focus, and learning path</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020420"/>
      <stop offset="100%" stop-color="#061A2B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="70%" stop-color="#00DC82"/>
      <stop offset="100%" stop-color="#00DC82" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-100 0;100 0;-100 0" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="14" y="14" width="1172" height="332" rx="18" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <text x="56" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="#00E5FF">CORE SYSTEM</text>
  <text x="56" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC">Front-End Engineer // Vue · Nuxt · TypeScript</text>
  <text x="56" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#94A3B8">5+ years building production web apps, reusable UI systems, PWAs, and maintainable frontend architecture.</text>

  <g transform="translate(56 190)">
    <rect width="340" height="120" rx="16" fill="#07131F" stroke="#00DC82" stroke-opacity="0.55"/>
    <text x="24" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#00DC82">CORE STACK</text>
    <text x="24" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Vue · Nuxt · TS · JS</text>
    <text x="24" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8">Pinia · Tailwind · Vite</text>
  </g>
  <g transform="translate(430 190)">
    <rect width="340" height="120" rx="16" fill="#07131F" stroke="#00E5FF" stroke-opacity="0.55"/>
    <text x="24" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#00E5FF">FOCUS</text>
    <text x="24" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Architecture · Performance</text>
    <text x="24" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8">Design systems · DX · SEO</text>
  </g>
  <g transform="translate(804 190)">
    <rect width="340" height="120" rx="16" fill="#07131F" stroke="#00C58E" stroke-opacity="0.55"/>
    <text x="24" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#00C58E">LEARNING</text>
    <text x="24" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">React · Next.js · Node</text>
    <text x="24" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8">Docker · AI-assisted tooling</text>
  </g>
</svg>
